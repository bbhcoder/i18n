name: Build Pre-compiled Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native Binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output_name: libencheco_i18n.so
            asset_name: linux-x64-libencheco_i18n.so

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output_name: encheco_i18n.dll
            asset_name: windows-x64-encheco_i18n.dll

          - os: macos-latest
            target: aarch64-apple-darwin
            output_name: libencheco_i18n.dylib
            asset_name: macos-arm64-libencheco_i18n.dylib

          - os: macos-latest
            target: x86_64-apple-darwin
            output_name: libencheco_i18n.dylib
            asset_name: macos-x64-libencheco_i18n.dylib
            
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Binary
        working-directory: i18n_flutter/rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename Asset
        shell: bash
        run: |
          # جستجوی هوشمندانه برای پیدا کردن فایل خروجی در پوشه ریلیز
          FILE_PATH=$(find . -type f -name "${{ matrix.output_name }}" | grep "/release/" | head -n 1)
          echo "Found binary at: $FILE_PATH"
          mv "$FILE_PATH" ${{ matrix.asset_name }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  build-android:
    name: Build Android Binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
      - name: Build Android Targets
        working-directory: i18n_flutter/rust
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o jniLibs build --release
      - name: Rename Artifacts
        run: |
          mv i18n_flutter/rust/jniLibs/arm64-v8a/libencheco_i18n.so android-arm64-libencheco_i18n.so
          mv i18n_flutter/rust/jniLibs/armeabi-v7a/libencheco_i18n.so android-arm-libencheco_i18n.so
          mv i18n_flutter/rust/jniLibs/x86_64/libencheco_i18n.so android-x64-libencheco_i18n.so
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries
          path: android-*-libencheco_i18n.so

  build-ios:
    name: Build iOS XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios, aarch64-apple-ios-sim
      - name: Build iOS Targets
        # با اجرای این دستورات در ریشه، فایل‌ها دقیقاً در فولدر target اصلی قرار می‌گیرند
        run: |
          cargo build -p rust_lib_i18n_flutter --release --target aarch64-apple-ios
          cargo build -p rust_lib_i18n_flutter --release --target x86_64-apple-ios
          cargo build -p rust_lib_i18n_flutter --release --target aarch64-apple-ios-sim
      - name: Create XCFramework
        run: |
          # ترکیب معماری‌های شبیه‌ساز (اینتل و M1)
          lipo -create -output target/libencheco_i18n_sim.a target/x86_64-apple-ios/release/libencheco_i18n.a target/aarch64-apple-ios-sim/release/libencheco_i18n.a
          # ساخت فریم‌ورک یکپارچه اپل
          xcodebuild -create-xcframework \
            -library target/aarch64-apple-ios/release/libencheco_i18n.a \
            -library target/libencheco_i18n_sim.a \
            -output encheco_i18n.xcframework
          # فشرده‌سازی جهت آپلود
          zip -r ios-encheco_i18n.xcframework.zip encheco_i18n.xcframework
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-encheco_i18n.xcframework.zip
          path: ios-encheco_i18n.xcframework.zip

 build-web:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (Nightly for build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        working-directory: i18n_flutter/rust
        env:
          RUSTFLAGS: '-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-arg=--shared-memory -C link-arg=--max-memory=67108864'
        run: wasm-pack build . -t no-modules -d ../web/pkg --no-typescript --out-name encheco_i18n --release -- -Z build-std=std,panic_abort
      - name: Upload Artifact JS
        uses: actions/upload-artifact@v4
        with:
          name: encheco_i18n.js
          path: i18n_flutter/web/pkg/encheco_i18n.js
      - name: Upload Artifact WASM
        uses: actions/upload-artifact@v4
        with:
          name: encheco_i18n_bg.wasm
          path: i18n_flutter/web/pkg/encheco_i18n_bg.wasm

  release:
    name: Create Release
    needs: [build-native, build-web, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten Artifacts
        run: |
          mkdir release_assets
          find dist -type f -exec mv {} release_assets/ \;
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/*