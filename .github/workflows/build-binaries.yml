name: Build Pre-compiled Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-native:
    name: Build Native Binaries
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output_name: libencheco_i18n.so
            asset_name: linux-x64-libencheco_i18n.so

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output_name: encheco_i18n.dll
            asset_name: windows-x64-encheco_i18n.dll

          - os: macos-latest
            target: aarch64-apple-darwin
            output_name: libencheco_i18n.dylib
            asset_name: macos-arm64-libencheco_i18n.dylib

          - os: macos-latest
            target: x86_64-apple-darwin
            output_name: libencheco_i18n.dylib
            asset_name: macos-x64-libencheco_i18n.dylib
            
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build Binary
        working-directory: i18n_flutter/rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: Rename Asset
        shell: bash
        run: mv i18n_flutter/rust/target/${{ matrix.target }}/release/${{ matrix.output_name }} ${{ matrix.asset_name }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  build-web:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (Nightly for build-std)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build WASM
        working-directory: i18n_flutter/rust
        run: wasm-pack build -t no-modules -d ../web/pkg --no-typescript --out-name encheco_i18n --dev -- -Z build-std=std,panic_abort
      - name: Upload Artifact JS
        uses: actions/upload-artifact@v4
        with:
          name: encheco_i18n.js
          path: i18n_flutter/web/pkg/encheco_i18n.js
      - name: Upload Artifact WASM
        uses: actions/upload-artifact@v4
        with:
          name: encheco_i18n_bg.wasm
          path: i18n_flutter/web/pkg/encheco_i18n_bg.wasm

  release:
    name: Create Release
    needs: [build-native, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten Artifacts
        run: |
          mkdir release_assets
          find dist -type f -exec mv {} release_assets/ \;
      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          files: release_assets/*